<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/svg/EmpIcon4.png" />
    <link rel="stylesheet" href="/assets/css/font.css" />
    <link rel="apple-touch-icon" href="/assets/jpg/EmpIcon4.png" />
    <link rel="manifest" href="/assets/manifest.json" />
    <title>EMP MANAGEMENT PORTAL</title>
    <style>
      @keyframes start-animation {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }
      .bg-loader-initial {
        background: #eab53a1d;
      }
      .initial-load-animation {
        animation-name: start-animation;
        animation-duration: 1s;
        animation-timing-function: ease;
        animation-iteration-count: infinite;
        animation-direction: alternate;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        style="
          width: 100vw;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          top: 0;
        "
      >
        <div
          style="height: 100vh; position: absolute; top: 0; width: 100%"
          class="bg-loader-initial"
        ></div>
        <div style="position: relative">
          <img
            src="/assets/svg/EmpIcon4.png"
            alt="EMP LOGO"
            class="initial-load-animation"
            width="50"
            height="50"
          />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
